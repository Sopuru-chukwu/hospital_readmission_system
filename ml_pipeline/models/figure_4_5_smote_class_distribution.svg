<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420">
  <rect width="820" height="420" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Figure 4.5: Training Set Class Distribution Before and After SMOTE</text>
  <text x="410" y="56" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b">Comparison of minority (&lt;30 Days Readmitted) and majority (Not Readmitted &lt;30 Days) class counts</text>

  <!-- Left Panel: Before SMOTE -->
  <text x="215" y="92" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Before SMOTE (Imbalanced: 11.5% Positive)</text>
  <line x1="75" y1="340" x2="365" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="75" y1="110" x2="75" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Not Readmitted <30d: 8,496 (88.5%) -->
  <rect x="115" y="130" width="75" height="210" rx="6" fill="#0ea5e9"/>
  <text x="152.5" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0284c7">8,496 (88.5%)</text>
  <text x="152.5" y="362" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">Not Readmitted &lt;30d</text>
  <text x="152.5" y="377" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">(Class 0)</text>
  <!-- Readmitted <30d: 1,104 (11.5%) -->
  <rect x="240" y="312.7" width="75" height="27.3" rx="6" fill="#ef4444"/>
  <text x="277.5" y="303" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">1,104 (11.5%)</text>
  <text x="277.5" y="362" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">Readmitted &lt;30d</text>
  <text x="277.5" y="377" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">(Class 1)</text>

  <!-- Right Panel: After SMOTE -->
  <text x="605" y="92" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">After SMOTE (Balanced: 50.0% Positive)</text>
  <line x1="465" y1="340" x2="755" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="465" y1="110" x2="465" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Not Readmitted <30d: 8,496 (50.0%) -->
  <rect x="505" y="130" width="75" height="210" rx="6" fill="#0ea5e9"/>
  <text x="542.5" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0284c7">8,496 (50.0%)</text>
  <text x="542.5" y="362" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">Not Readmitted &lt;30d</text>
  <text x="542.5" y="377" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">(Class 0)</text>
  <!-- Readmitted <30d: 8,496 (50.0%) -->
  <rect x="630" y="130" width="75" height="210" rx="6" fill="#10b981"/>
  <text x="667.5" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#059669">8,496 (50.0%)</text>
  <text x="667.5" y="362" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155">Readmitted &lt;30d</text>
  <text x="667.5" y="377" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">(Class 1 - Oversampled)</text>
</svg>