<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480">
  <rect width="680" height="480" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="340" y="36" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Confusion Matrix – Best Performing Model (Soft-Voting Ensemble)</text>
  <text x="340" y="56" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b">Holdout Test Set (n = 2,400 encounters | ROC-AUC = 0.9117 | Clinical Threshold p ≥ 0.35)</text>

  <!-- Axis Headers -->
  <text x="390" y="92" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b">PREDICTED CLASS</text>
  <text x="280" y="116" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Not Readmitted &lt;30d (0)</text>
  <text x="500" y="116" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Readmitted &lt;30d (1)</text>

  <text x="42" y="265" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1e293b" transform="rotate(-90 42 265)">ACTUAL CLASS</text>
  <text x="155" y="195" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Not Readmitted &lt;30d (0)</text>
  <text x="155" y="212" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">(n = 2,124)</text>
  <text x="155" y="335" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Readmitted &lt;30d (1)</text>
  <text x="155" y="352" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748b">(n = 276)</text>

  <!-- TN Cell -->
  <rect x="175" y="130" width="210" height="130" rx="12" fill="#0ea5e9" fill-opacity="0.88" stroke="#0284c7" stroke-width="2"/>
  <text x="280" y="175" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#e0f2fe">TRUE NEGATIVE (TN)</text>
  <text x="280" y="212" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">1,773</text>
  <text x="280" y="238" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#f0f9ff">83.47% of Actual Negatives</text>

  <!-- FP Cell -->
  <rect x="395" y="130" width="210" height="130" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="175" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">FALSE POSITIVE (FP)</text>
  <text x="500" y="212" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#92400e">351</text>
  <text x="500" y="238" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309">16.53% False Alarm Rate</text>

  <!-- FN Cell -->
  <rect x="175" y="270" width="210" height="130" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="280" y="315" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">FALSE NEGATIVE (FN)</text>
  <text x="280" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#991b1b">44</text>
  <text x="280" y="378" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#b91c1c">15.94% Missed Readmissions</text>

  <!-- TP Cell -->
  <rect x="395" y="270" width="210" height="130" rx="12" fill="#10b981" fill-opacity="0.90" stroke="#059669" stroke-width="2"/>
  <text x="500" y="315" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#d1fae5">TRUE POSITIVE (TP)</text>
  <text x="500" y="352" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800" fill="#ffffff">232</text>
  <text x="500" y="378" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#ecfdf5">84.06% Sensitivity (Recall)</text>

  <!-- Footer Summary -->
  <rect x="175" y="418" width="430" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="390" y="443" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Accuracy: 83.54% (2,005 / 2,400)  |  Sensitivity: 84.06%  |  Specificity: 83.47%  |  F1: 0.5402</text>
</svg>